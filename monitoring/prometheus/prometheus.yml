global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'flower'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'celery_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['celery-exporter:9404']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

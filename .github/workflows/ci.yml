name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_resume_filter/requirements.txt
      - name: Run tests
        run: |
          export CREWAI_MOCK_MODE=1
          pytest -q
      - name: Run Crew mock integration test
        run: |
          export CREWAI_MOCK_MODE=1
          pytest -q ai_resume_filter/tests/test_crew_client.py
      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 ai_resume_filter || true
      - name: Format check (black)
        run: |
          pip install black
          black --check . || true
